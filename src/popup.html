<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productivity Suite - Popup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .popup-container {
      padding: 16px;
      background: white;
    }
    
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .popup-header h2 {
      font-size: 18px;
      color: #667eea;
    }
    
    .header-icons {
      display: flex;
      gap: 8px;
    }
    
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
    }
    
    .icon-btn:hover {
      background: #f5f5f5;
      border-radius: 4px;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      font-weight: 500;
    }
    
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }
    
    textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }
    
    .button-group {
      display: flex;
      gap: 8px;
    }
    
    button {
      flex: 1;
      padding: 8px 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #5568d3;
    }
    
    button.secondary {
      background: #f0f0f0;
      color: #333;
    }
    
    button.secondary:hover {
      background: #e0e0e0;
    }
    
    .list-container {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .item {
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    
    .item span {
      flex: 1;
      word-break: break-word;
      font-size: 12px;
    }
    
    .item button {
      flex: none;
      width: auto;
      padding: 4px 8px;
      font-size: 11px;
    }
    
    .session-item {
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #eee;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    
    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .session-name {
      font-weight: 600;
      color: #333;
      font-size: 12px;
    }
    
    .session-actions {
      display: flex;
      gap: 4px;
    }
    
    .session-actions button {
      flex: none;
      width: auto;
      padding: 4px 8px;
      font-size: 11px;
    }
    
    .session-urls {
      font-size: 11px;
      color: #666;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #eee;
    }
    
    .session-urls > p {
      margin: 4px 0;
      word-break: break-all;
    }
    
    .empty-state {
      text-align: center;
      color: #999;
      font-size: 12px;
      padding: 20px 0;
    }
    
    .options-link {
      text-align: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
    }
    
    button.options-btn {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h2>Productivity Suite</h2>
      <div class="header-icons">
        <button class="icon-btn" title="Export Data" data-testid="export-data-btn">📥</button>
        <button class="icon-btn" title="Settings" id="open-options-btn" data-testid="open-options-btn">⚙️</button>
      </div>
    </div>

    <!-- Notes Section -->
    <div class="section">
      <div class="section-title">Quick Notes</div>
      <div class="form-group">
        <textarea id="notes-textarea" data-testid="notes-textarea" placeholder="Write your notes here..." rows="3"></textarea>
      </div>
      <button id="save-notes-btn" data-testid="save-notes-btn">Save Note</button>
      <div id="notes-list" class="list-container" style="margin-top: 12px;"></div>
    </div>

    <!-- Sessions Section -->
    <div class="section">
      <div class="section-title">Session Manager</div>
      <button id="save-session-btn" data-testid="save-session-btn">Save Current Session</button>
      <div id="sessions-list" class="list-container" style="margin-top: 12px;" data-testid="sessions-list"></div>
    </div>

    <!-- Options Link -->
    <div class="options-link">
      <button class="options-btn secondary" id="open-options-link">Manage Settings</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
