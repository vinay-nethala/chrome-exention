<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .blocked-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      padding: 60px 40px;
      text-align: center;
      max-width: 500px;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .blocked-icon {
      font-size: 72px;
      margin-bottom: 24px;
    }
    
    h1 {
      color: #e74c3c;
      font-size: 32px;
      margin-bottom: 12px;
    }
    
    .blocked-message {
      color: #666;
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    
    .blocked-url {
      background: #f5f5f5;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
      word-break: break-all;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      color: #333;
      border-left: 4px solid #e74c3c;
    }
    
    .blocked-info {
      font-size: 13px;
      color: #999;
      margin: 24px 0;
      padding: 16px;
      background: #fef5f5;
      border-radius: 8px;
      line-height: 1.6;
    }
    
    .blocked-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: center;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .go-back {
      background: #667eea;
      color: white;
    }
    
    .go-back:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .new-tab {
      background: #f0f0f0;
      color: #333;
    }
    
    .new-tab:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="blocked-container">
    <div class="blocked-icon">🚫</div>
    <h1 data-testid="blocked-message">This Site is Blocked</h1>
    <p class="blocked-message">This website has been added to your blocklist by Productivity Suite.</p>
    
    <div class="blocked-url" id="blocked-url">
      (Loading...)
    </div>
    
    <div class="blocked-info">
      <strong>Why?</strong><br>
      You added this site to your blocklist to help you stay focused and productive.
    </div>
    
    <div class="blocked-actions">
      <button class="go-back" onclick="goBack()">← Go Back</button>
      <button class="new-tab" onclick="openNewTab()">↗ New Tab</button>
    </div>
  </div>
  
  <script>
    function getUrlParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }
    
    function goBack() {
      window.history.back();
    }
    
    function openNewTab() {
      chrome.tabs.create({ url: "chrome://newtab" });
      window.close();
    }
    
    document.addEventListener("DOMContentLoaded", () => {
      const url = getUrlParam("url");
      if (url) {
        document.getElementById("blocked-url").textContent = url;
      }
    });
  </script>
</body>
</html>
